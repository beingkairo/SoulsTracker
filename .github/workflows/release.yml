name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify release target
        id: target
        shell: pwsh
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $tag = & ./scripts/Verify-ReleaseTarget.ps1 -EventName $env:RELEASE_EVENT -EventRef $env:RELEASE_REF -ExpectedCommit $env:RELEASE_COMMIT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301

      - uses: actions/setup-node@v4
        with:
          node-version-file: web_overlay/.nvmrc
          cache: npm
          cache-dependency-path: web_overlay/package-lock.json

      - name: Read product version
        id: version
        shell: pwsh
        run: |
          $metadata = & ./eng/Get-ReleaseMetadata.ps1
          "value=$($metadata.Version)" >> $env:GITHUB_OUTPUT
          "artifact_stem=$($metadata.ArtifactStem)" >> $env:GITHUB_OUTPUT
          "release_notes=$($metadata.ReleaseNotesPath)" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build and test release candidate
        shell: pwsh
        run: ./scripts/Build-Release.ps1

      - name: Create portable archive and checksums
        shell: pwsh
        run: |
          $release = 'artifacts/desktop'
          $artifactStem = '${{ steps.version.outputs.artifact_stem }}'
          Compress-Archive -Path "$release/*" -DestinationPath "artifacts/$artifactStem-portable.zip" -Force
          Get-FileHash "installer/Output/$artifactStem.exe", "artifacts/$artifactStem-portable.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content -Encoding ascii 'artifacts/SHA256SUMS.txt'

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: artifacts/desktop
          format: spdx-json
          output-file: artifacts/${{ steps.version.outputs.artifact_stem }}.sbom.spdx.json

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            installer/Output/${{ steps.version.outputs.artifact_stem }}.exe
            artifacts/${{ steps.version.outputs.artifact_stem }}-portable.zip
            artifacts/SHA256SUMS.txt
            artifacts/${{ steps.version.outputs.artifact_stem }}.sbom.spdx.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          generate_release_notes: true
          body_path: ${{ steps.version.outputs.release_notes }}
          files: |
            installer/Output/${{ steps.version.outputs.artifact_stem }}.exe
            artifacts/${{ steps.version.outputs.artifact_stem }}-portable.zip
            artifacts/SHA256SUMS.txt
            artifacts/${{ steps.version.outputs.artifact_stem }}.sbom.spdx.json

      - name: Append setup guide to release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Release notes lookup failed." }
          $release = $releaseJson | ConvertFrom-Json
          $guide = Get-Content -Raw -Encoding utf8 'docs/RELEASE-GETTING-STARTED.md'
          $existingNotes = if ($null -eq $release.body) { "" } else { $release.body.TrimEnd() }
          $notes = "$existingNotes`n`n$($guide.Trim())"
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" -f "body=$notes"
          if ($LASTEXITCODE -ne 0) { throw "Release notes update failed." }
