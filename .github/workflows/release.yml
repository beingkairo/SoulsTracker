name: Release

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [prepare, publish]
        default: prepare
        required: true
      prepared_run_id:
        description: Successful preparation run ID (publish only)
        type: string
      artifact_id:
        description: Immutable prepared artifact ID (publish only)
        type: string
      approved_manifest_sha256:
        description: Owner-approved release-manifest SHA256 (publish only)
        type: string

concurrency:
  group: desktop-v2.1.2-publication
  cancel-in-progress: false

permissions:
  contents: read

env:
  APPROVED_SOURCE: b65d3ca91aefd95037ca8737807979c341adfc80
  APPROVED_IMPLEMENTATION: b65d3ca91aefd95037ca8737807979c341adfc80

jobs:
  prepare:
    if: inputs.action == 'prepare'
    runs-on: windows-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_SOURCE }}
          path: source
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301
      - uses: actions/setup-node@v4
        with:
          node-version-file: source/web_overlay/.nvmrc
          cache: npm
          cache-dependency-path: source/web_overlay/package-lock.json
      - name: Verify source and read version
        shell: pwsh
        run: |
          if ((git -C source rev-parse HEAD) -cne $env:APPROVED_SOURCE) { throw 'Unapproved source' }
          git -C source diff --exit-code $env:APPROVED_IMPLEMENTATION HEAD -- src web_overlay/src cloud_overlay/src installer eng
          if ($LASTEXITCODE) { throw 'Application implementation changed' }
          $metadata = & ./source/eng/Get-ReleaseMetadata.ps1
          if ($metadata.Version -ne '2.1.2') { throw 'Unexpected version' }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Build and test approved application source
        shell: pwsh
        working-directory: source
        run: ./scripts/Build-Release.ps1
      - name: Create portable archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          Copy-Item source/installer/Output/SoulsTrackerV2.1.2.exe release/
          Compress-Archive -Path source/artifacts/desktop/* -DestinationPath release/SoulsTrackerV2.1.2-portable.zip
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: source/artifacts/desktop
          format: spdx-json
          syft-version: v1.52.0
          output-file: release/SoulsTrackerV2.1.2.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Reconcile candidate checksums and record exact inputs
        shell: pwsh
        run: |
          python control/scripts/verify_publication.py prepare --directory release --payload source/artifacts/desktop --source source --workflow-commit '${{ github.sha }}' --run-id '${{ github.run_id }}'
          if ($LASTEXITCODE) { throw 'Release reconciliation failed' }
      - name: Generate GitHub build predicate
        id: predicate
        uses: actions/attest-build-provenance/predicate@1176ef556905f349f669722abf30bce1a6e16e01
      - name: Record separately checked out application source
        shell: pwsh
        env:
          PREDICATE: ${{ steps.predicate.outputs.predicate }}
        run: |
          $p = $env:PREDICATE | ConvertFrom-Json -AsHashtable
          $p.buildDefinition.resolvedDependencies += @{ uri = 'git+https://github.com/${{ github.repository }}'; digest = @{ gitCommit = $env:APPROVED_SOURCE } }
          $p.buildDefinition.externalParameters.approvedApplicationCommit = $env:APPROVED_SOURCE
          $p.buildDefinition.externalParameters.approvedImplementationCommit = $env:APPROVED_IMPLEMENTATION
          $p | ConvertTo-Json -Depth 100 | Set-Content predicate.json -Encoding utf8NoBOM
      - name: Attest release artifacts
        id: attest
        uses: actions/attest@ce27ba3b4a9a139d9a20a4a07d69fabb52f1e5bc
        with:
          subject-path: release/*
          predicate-type: ${{ steps.predicate.outputs.predicate-type }}
          predicate-path: predicate.json
      - name: Include signed bundle and approval digest
        shell: pwsh
        run: |
          Copy-Item '${{ steps.attest.outputs.bundle-path }}' release/provenance.sigstore.json
          $hash = (Get-FileHash release/release-manifest.json -Algorithm SHA256).Hash.ToLowerInvariant()
          "Preparation run: ${{ github.run_id }}; manifest SHA256: $hash" >> $env:GITHUB_STEP_SUMMARY
          Get-Content release/SHA256SUMS.txt >> $env:GITHUB_STEP_SUMMARY
          Get-Content release/release-manifest.json >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: desktop-v2.1.2-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/*
          retention-days: 30
          if-no-files-found: error
      - shell: pwsh
        run: '"Immutable artifact ID: ${{ steps.upload.outputs.artifact-id }}" >> $env:GITHUB_STEP_SUMMARY'

  publish:
    if: inputs.action == 'publish'
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
      - name: Validate immutable preparation selection
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_RUN: ${{ inputs.prepared_run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          APPROVED_MANIFEST: ${{ inputs.approved_manifest_sha256 }}
        run: |
          if ($env:PREPARED_RUN -cnotmatch '^[1-9][0-9]*$' -or $env:ARTIFACT_ID -cnotmatch '^[1-9][0-9]*$' -or $env:APPROVED_MANIFEST -cnotmatch '^[a-f0-9]{64}$') { throw 'Explicit run, artifact and manifest approval required' }
          $repo = '${{ github.repository }}'
          $run = gh api "repos/$repo/actions/runs/$env:PREPARED_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Cannot inspect preparation run' }
          $current = gh api "repos/$repo/actions/runs/${{ github.run_id }}" | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Cannot inspect current run' }
          if ($run.conclusion -ne 'success' -or $run.head_sha -cne '${{ github.sha }}' -or $run.workflow_id -ne $current.workflow_id -or $run.event -ne 'workflow_dispatch') { throw 'Preparation run or workflow differs' }
          $artifact = gh api "repos/$repo/actions/artifacts/$env:ARTIFACT_ID" | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Cannot inspect artifact' }
          if ($artifact.expired -or $artifact.workflow_run.id.ToString() -cne $env:PREPARED_RUN -or $artifact.name -cnotmatch "^desktop-v2\.1\.2-$($env:PREPARED_RUN)-[1-9][0-9]*$") { throw 'Artifact does not belong to preparation run' }
          # Prove absence rather than treating authentication/network failures as absence.
          foreach ($resource in @('git/ref/tags/v2.1.2', 'releases/tags/v2.1.2')) {
            $status = gh api --include "repos/$repo/$resource" 2>&1 | Out-String
            if ($status -notmatch 'HTTP/[^ ]+ 404') { throw 'Cannot prove release and tag are absent' }
          }
          $global:LASTEXITCODE = 0
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}
          path: prepared
          merge-multiple: true
      - name: Verify approved bytes and signed provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_MANIFEST: ${{ inputs.approved_manifest_sha256 }}
          PREPARED_RUN: ${{ inputs.prepared_run_id }}
        run: |
          python control/scripts/verify_publication.py verify --directory prepared --approved-manifest $env:APPROVED_MANIFEST --workflow-commit '${{ github.sha }}' --run-id $env:PREPARED_RUN
          if ($LASTEXITCODE) { throw 'Publication integrity check failed' }
          Get-ChildItem prepared -File | Where-Object Name -ne 'provenance.sigstore.json' | ForEach-Object {
            gh attestation verify $_.FullName --bundle prepared/provenance.sigstore.json --repo '${{ github.repository }}' --signer-workflow '${{ github.repository }}/.github/workflows/release.yml' --signer-digest '${{ github.sha }}' --deny-self-hosted-runners
            if ($LASTEXITCODE) { throw 'Signed provenance verification failed' }
          }
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.2
          target_commitish: ${{ env.APPROVED_SOURCE }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body_path: prepared/release-notes.md
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            prepared/SoulsTrackerV2.1.2.exe
            prepared/SoulsTrackerV2.1.2-portable.zip
            prepared/SoulsTrackerV2.1.2.sbom.spdx.json
            prepared/SHA256SUMS.txt
            prepared/release-manifest.json
            prepared/provenance.sigstore.json
