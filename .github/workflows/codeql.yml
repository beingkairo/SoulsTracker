name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C#
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.301
      - uses: actions/setup-node@v7
        with:
          node-version-file: web_overlay/.nvmrc
          cache: npm
          cache-dependency-path: web_overlay/package-lock.json
      - run: npm ci --prefix web_overlay
      - run: dotnet restore SoulsTracker.sln --locked-mode
      - run: dotnet build SoulsTracker.sln --configuration Release --no-restore
      - uses: github/codeql-action/analyze@v4
